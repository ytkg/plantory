<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantory | 植物一覧</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur"><div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8"><a class="mr-auto text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a><nav class="hidden items-center gap-4 sm:flex" aria-label="管理ナビゲーション"><a class="text-sm font-semibold text-stone-600" href="/">観察日記</a><a class="text-sm font-semibold text-leaf-700 underline underline-offset-4" href="/plants" aria-current="page">植物一覧</a><a class="text-sm font-semibold text-stone-600" href="/settings/api-keys">API キー管理</a></nav><button class="logout hidden text-sm font-semibold text-leaf-700 sm:block">ログアウト</button><details class="relative sm:hidden"><summary class="flex size-11 list-none items-center justify-center rounded-xl bg-leaf-100 text-sm font-semibold text-leaf-700">メニュー</summary><nav class="absolute right-0 top-12 z-20 grid w-52 gap-1 rounded-2xl border border-leaf-100 bg-white p-2 shadow-xl" aria-label="管理メニュー"><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/">観察日記</a><a class="rounded-xl bg-leaf-50 text-leaf-700 px-4 py-3 text-sm font-semibold" href="/plants" aria-current="page">植物一覧</a><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/settings/api-keys">API キー管理</a><button class="logout rounded-xl px-4 py-3 text-left text-sm font-semibold text-leaf-700 hover:bg-leaf-50">ログアウト</button></nav></details></div></header>
    <main class="mx-auto w-full max-w-2xl px-5 pb-8 pt-24 sm:px-8 sm:pb-12 sm:pt-28">
      <header class="mb-12"><h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">わたしの植物</h1><p class="mt-3 text-base leading-7 text-stone-600">日々の変化を、ゆっくり記録していこう。</p></header>
      <section aria-labelledby="plants-heading"><div class="mb-5 flex items-center justify-between gap-4"><h2 id="plants-heading" class="text-lg font-semibold">植物一覧</h2><div class="flex items-center gap-3"><span id="plant-count" class="rounded-full bg-leaf-100 px-3 py-1 text-sm font-medium text-leaf-700">—</span><button id="open-create-plant" class="rounded-xl bg-leaf-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-leaf-500">植物を追加</button></div></div><p id="plant-feedback" class="mb-4 hidden text-sm" role="status" aria-live="polite"></p><div id="plants" class="grid gap-3" aria-live="polite"><p class="rounded-2xl border border-leaf-100 bg-white px-5 py-6 text-stone-500 shadow-sm">植物を読み込んでいます…</p></div></section>
    </main>
    <footer class="border-t border-leaf-100/80 py-6 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <dialog id="create-plant-dialog" class="m-auto w-[calc(100%-2.5rem)] max-w-md rounded-2xl border border-leaf-100 bg-white p-0 text-ink shadow-xl backdrop:bg-ink/30">
      <form id="create-plant-form" class="p-6" novalidate>
        <div class="flex items-start justify-between gap-4"><div><h2 class="text-xl font-semibold">植物を追加</h2><p class="mt-2 text-sm leading-6 text-stone-600">植物の名前を入力してください。</p></div><button type="button" id="close-create-plant" class="-mr-2 -mt-2 rounded-lg px-2 py-1 text-2xl leading-none text-stone-500 hover:bg-leaf-50" aria-label="閉じる">×</button></div>
        <label class="mt-6 block text-sm font-semibold" for="plant-name">名前</label>
        <input id="plant-name" name="name" type="text" maxlength="100" required autocomplete="off" class="mt-2 w-full rounded-xl border border-leaf-100 bg-white px-4 py-3 text-base outline-none transition focus:border-leaf-500 focus:ring-2 focus:ring-leaf-100" />
        <p id="create-plant-error" class="mt-3 hidden text-sm text-rose-700" role="alert"></p>
        <div class="mt-6 flex justify-end gap-3"><button type="button" id="cancel-create-plant" class="rounded-xl px-4 py-2 text-sm font-semibold text-stone-600 hover:bg-leaf-50">キャンセル</button><button id="submit-create-plant" type="submit" class="rounded-xl bg-leaf-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-leaf-500 disabled:cursor-wait disabled:opacity-60">追加する</button></div>
      </form>
    </dialog>
    <dialog id="delete-metrics-dialog" class="m-auto w-[calc(100%-2.5rem)] max-w-md rounded-2xl border border-leaf-100 bg-white p-0 text-ink shadow-xl backdrop:bg-ink/30">
      <form id="delete-metrics-form" class="p-6">
        <div class="flex items-start justify-between gap-4"><div><h2 class="text-xl font-semibold">測定データを削除</h2><p id="delete-metrics-message" class="mt-3 text-sm leading-6 text-stone-600"></p></div><button type="button" id="close-delete-metrics" class="-mr-2 -mt-2 rounded-lg px-2 py-1 text-2xl leading-none text-stone-500 hover:bg-leaf-50" aria-label="閉じる">×</button></div>
        <div class="mt-6 flex justify-end gap-3"><button type="button" id="cancel-delete-metrics" class="rounded-xl px-4 py-2 text-sm font-semibold text-stone-600 hover:bg-leaf-50">キャンセル</button><button id="submit-delete-metrics" type="submit" class="rounded-xl bg-rose-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-600 disabled:cursor-wait disabled:opacity-60">すべて削除</button></div>
      </form>
    </dialog>
    <script src="/chart.umd.min.js"></script>
    <script type="module" src="/plants.js"></script>
  </body>
</html>

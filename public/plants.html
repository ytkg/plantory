<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantory | 植物一覧</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur"><div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8"><a class="mr-auto text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a><nav class="flex items-center gap-4" aria-label="管理ナビゲーション"><a class="text-sm font-semibold text-leaf-700" href="/plants">植物一覧</a><a class="text-sm font-semibold text-stone-600" href="/settings/api-keys">API キー管理</a></nav><button id="logout" class="rounded-xl border border-leaf-100 bg-white px-3 py-2 text-sm font-semibold text-leaf-700 shadow-sm">ログアウト</button></div></header>
    <main class="mx-auto w-full max-w-2xl flex-1 px-5 pb-12 pt-28 sm:px-8 sm:pb-20 sm:pt-36">
      <header class="mb-12"><h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">わたしの植物</h1><p class="mt-3 text-base leading-7 text-stone-600">日々の変化を、ゆっくり記録していこう。</p></header>
      <section aria-labelledby="plants-heading"><div class="mb-5 flex items-center justify-between"><h2 id="plants-heading" class="text-lg font-semibold">植物一覧</h2><span id="plant-count" class="rounded-full bg-leaf-100 px-3 py-1 text-sm font-medium text-leaf-700">—</span></div><div id="plants" class="grid gap-3" aria-live="polite"><p class="rounded-2xl border border-leaf-100 bg-white px-5 py-6 text-stone-500 shadow-sm">植物を読み込んでいます…</p></div></section>
    </main>
    <footer class="border-t border-leaf-100/80 py-6 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <script type="module" src="/plants.js"></script>
  </body>
</html>

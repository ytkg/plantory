<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantory | API キー</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur">
      <div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8">
        <a class="mr-auto text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a>
        <nav class="hidden items-center gap-4 sm:flex" aria-label="管理ナビゲーション">
          <a class="text-sm font-semibold text-stone-600" href="/">観察日記</a>
          <a class="text-sm font-semibold text-stone-600" href="/plants">植物一覧</a>
          <a class="text-sm font-semibold text-leaf-700 underline underline-offset-4" href="/settings/api-keys" aria-current="page">API キー管理</a>
        </nav>
        <button class="logout hidden text-sm font-semibold text-leaf-700 sm:block">ログアウト</button>
        <details class="relative sm:hidden">
          <summary class="flex size-11 list-none items-center justify-center rounded-xl bg-leaf-100 text-sm font-semibold text-leaf-700">メニュー</summary>
          <nav class="absolute right-0 top-12 z-20 grid w-52 gap-1 rounded-2xl border border-leaf-100 bg-white p-2 shadow-xl" aria-label="管理メニュー">
            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-stone-600 hover:bg-leaf-50" href="/">観察日記</a>
            <a class="rounded-xl px-4 py-3 text-sm font-semibold text-stone-600 hover:bg-leaf-50" href="/plants">植物一覧</a>
            <a class="rounded-xl bg-leaf-50 px-4 py-3 text-sm font-semibold text-leaf-700" href="/settings/api-keys" aria-current="page">API キー管理</a>
            <button class="logout rounded-xl px-4 py-3 text-left text-sm font-semibold text-leaf-700 hover:bg-leaf-50">ログアウト</button>
          </nav>
        </details>
      </div>
    </header>
    <main class="mx-auto w-full max-w-2xl px-5 pb-8 pt-24 sm:px-8 sm:pb-12 sm:pt-28">
      <header>
        <h1 class="text-3xl font-semibold">API キー</h1>
        <p class="mt-3 leading-7 text-stone-600">外部のセンサーや連携サービス用のキーを管理します。</p>
      </header>
      <section class="mt-10 rounded-3xl border border-leaf-100 bg-white p-6 shadow-sm">
        <h2 class="text-lg font-semibold">新しいキーを発行</h2>
        <form id="key-form" class="mt-5 grid gap-4">
          <label class="grid gap-2 text-sm font-medium">用途名<input class="rounded-xl border border-stone-200 px-3 py-2.5" name="name" placeholder="リビングの温湿度センサー" required /></label>
          <label class="grid gap-2 text-sm font-medium">権限<select class="rounded-xl border border-stone-200 px-3 py-2.5" name="scope"><option value="write">write — 登録・取得</option><option value="read">read — 取得のみ</option></select></label>
          <button class="rounded-xl bg-leaf-700 px-4 py-3 text-sm font-semibold text-white" type="submit">キーを発行</button>
        </form>
        <div id="new-key" class="mt-5 hidden rounded-xl bg-leaf-50 p-4"><p class="text-sm font-semibold text-leaf-700">このキーは今だけ表示されます。</p><code id="new-key-value" class="mt-3 block break-all rounded-lg bg-white p-3 text-sm"></code><button id="copy-new-key" class="mt-3 text-sm font-semibold text-leaf-700 underline underline-offset-4" type="button">キーをコピー</button></div>
      </section>
      <p id="key-feedback" class="mt-5 hidden text-sm" role="status" aria-live="polite"></p>
      <section class="mt-8"><h2 class="text-lg font-semibold">発行済みのキー</h2><div id="key-list" class="mt-4 grid gap-3"></div></section>
    </main>
    <footer class="border-t border-leaf-100/80 py-6 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <script type="module" src="/api-keys.js"></script>
  </body>
</html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Plantory | API キー</title><link rel="stylesheet" href="/styles.css" /></head><body class="min-h-screen bg-leaf-50 text-ink antialiased"><main class="mx-auto min-h-screen max-w-2xl px-5 py-12 sm:px-8 sm:py-20"><a class="text-sm font-semibold text-leaf-700 underline underline-offset-4" href="/plants">← 植物一覧</a><header class="mt-8"><p class="text-sm font-semibold tracking-[0.2em] text-leaf-700">PLANTORY</p><h1 class="mt-3 text-3xl font-semibold">API キー</h1><p class="mt-3 leading-7 text-stone-600">外部のセンサーや連携サービス用のキーを管理します。</p></header><section class="mt-10 rounded-3xl border border-leaf-100 bg-white p-6 shadow-sm"><h2 class="text-lg font-semibold">新しいキーを発行</h2><form id="key-form" class="mt-5 grid gap-4"><label class="grid gap-2 text-sm font-medium">用途名<input class="rounded-xl border border-stone-200 px-3 py-2.5" name="name" placeholder="リビングの温湿度センサー" required /></label><label class="grid gap-2 text-sm font-medium">権限<select class="rounded-xl border border-stone-200 px-3 py-2.5" name="scope"><option value="write">write — 登録・取得</option><option value="read">read — 取得のみ</option></select></label><button class="rounded-xl bg-leaf-700 px-4 py-3 text-sm font-semibold text-white" type="submit">キーを発行</button></form><div id="new-key" class="mt-5 hidden rounded-xl bg-leaf-50 p-4"><p class="text-sm font-semibold text-leaf-700">このキーは今だけ表示されます。</p><code id="new-key-value" class="mt-3 block break-all rounded-lg bg-white p-3 text-sm"></code></div></section><section class="mt-8"><h2 class="text-lg font-semibold">発行済みのキー</h2><div id="key-list" class="mt-4 grid gap-3"></div></section></main><script type="module" src="/api-keys.js"></script></body></html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4faf5" />
    <title>Plantory | 日報</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-leaf-50 text-ink antialiased">
    <main class="mx-auto min-h-screen max-w-2xl px-5 py-12 sm:px-8 sm:py-20">
      <header class="mb-12">
        <p class="mb-3 text-sm font-semibold tracking-[0.2em] text-leaf-700">PLANTORY</p>
        <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">植物の日報</h1>
        <p class="mt-3 text-base leading-7 text-stone-600">日々の変化を、ゆっくり記録していこう。</p>
      </header>

      <section class="rounded-3xl border border-leaf-100 bg-white p-7 shadow-sm">
        <p class="text-sm font-semibold text-leaf-700">COMING SOON</p>
        <h2 class="mt-3 text-xl font-semibold">公開日報を準備しています</h2>
        <p class="mt-3 leading-7 text-stone-600">日々の植物の変化を、誰でも読めるかたちでお届けします。</p>
        <a class="mt-6 inline-flex rounded-xl bg-leaf-700 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-leaf-500" href="/login">管理画面へ</a>
      </section>
    </main>
  </body>
</html>

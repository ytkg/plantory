<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4faf5" />
    <title>Plantory | 観察日記</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur"><div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8"><a class="mr-auto text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a><nav class="hidden items-center gap-4 sm:flex" aria-label="管理ナビゲーション"><a class="text-sm font-semibold text-leaf-700 underline underline-offset-4" href="/" aria-current="page">観察日記</a><a class="text-sm font-semibold text-stone-600" href="/plants">植物一覧</a><a class="text-sm font-semibold text-stone-600" href="/settings/api-keys">API キー管理</a></nav><button class="logout hidden text-sm font-semibold text-leaf-700 sm:block">ログアウト</button><details class="relative sm:hidden"><summary class="flex size-11 cursor-pointer list-none items-center justify-center rounded-xl bg-leaf-100 text-xl leading-none text-leaf-700" aria-label="メニューを開く"><span aria-hidden="true">☰</span></summary><nav class="absolute right-0 top-12 z-20 grid w-52 gap-1 rounded-2xl border border-leaf-100 bg-white p-2 shadow-xl" aria-label="管理メニュー"><a class="rounded-xl bg-leaf-50 text-leaf-700 px-4 py-3 text-sm font-semibold" href="/" aria-current="page">観察日記</a><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/plants">植物一覧</a><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/settings/api-keys">API キー管理</a><button class="logout rounded-xl px-4 py-3 text-left text-sm font-semibold text-leaf-700 hover:bg-leaf-50">ログアウト</button></nav></details></div></header>
    <main class="mx-auto w-full max-w-2xl px-5 pb-8 pt-24 sm:px-8 sm:pb-12 sm:pt-28">
      <section aria-labelledby="reports-heading">
        <h1 id="reports-heading" class="text-3xl font-semibold tracking-tight sm:text-4xl">観察日記</h1>
        <p class="mt-3 leading-7 text-stone-600">植物たちの、いまの様子を記録しています。</p>
        <div id="reports" class="mt-8 grid gap-4" aria-live="polite"><section><h2 class="text-sm font-semibold tracking-[0.12em] text-leaf-700">最新の観察</h2><p class="mt-3 rounded-3xl border border-leaf-100 bg-white p-7 text-stone-500 shadow-sm sm:p-8">観察日記を読み込んでいます…</p></section></div>
      </section>
    </main>
    <footer class="border-t border-leaf-100/80 py-6 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <script type="module" src="/authenticated-header.js"></script>
    <script type="module" src="/reports.js"></script>
  </body>
</html>

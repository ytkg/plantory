<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantory | ログイン</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur"><div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8 justify-between"><a class="text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a><nav class="flex items-center gap-4" aria-label="公開ナビゲーション"><a class="text-sm font-semibold text-leaf-700" href="/">観察日記</a></nav></div></header>
    <main class="mx-auto flex w-full max-w-md flex-1 items-center px-5 py-28">
      <section class="w-full rounded-3xl border border-leaf-100 bg-white p-7 shadow-sm sm:p-9">
        <p class="text-sm font-semibold tracking-[0.2em] text-leaf-700">PLANTORY</p>
        <h1 class="mt-4 text-2xl font-semibold">ログイン</h1>
        <p class="mt-2 text-sm leading-6 text-stone-600">植物の管理画面へ進みます。</p>
        <form id="login-form" class="mt-8 grid gap-5">
          <label class="grid gap-2 text-sm font-medium">ユーザー名<input class="rounded-xl border border-stone-200 px-3 py-2.5 outline-none ring-leaf-500 focus:ring-2" name="username" autocomplete="username" required /></label>
          <label class="grid gap-2 text-sm font-medium">パスワード<input class="rounded-xl border border-stone-200 px-3 py-2.5 outline-none ring-leaf-500 focus:ring-2" name="password" type="password" autocomplete="current-password" required /></label>
          <p id="login-error" class="hidden text-sm text-rose-700" role="alert"></p>
          <button class="rounded-xl bg-leaf-700 px-4 py-3 text-sm font-semibold text-white transition hover:bg-leaf-500 disabled:opacity-60" type="submit">ログイン</button>
        </form>
      </section>
    </main>
    <footer class="border-t border-leaf-100/80 py-3 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <script type="module" src="/login.js"></script>
  </body>
</html>

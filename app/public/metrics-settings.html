<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantory | 送信間隔</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="flex min-h-screen flex-col bg-leaf-50 text-ink antialiased">
    <header class="fixed inset-x-0 top-0 z-10 border-b border-leaf-100/80 bg-white/80 backdrop-blur"><div class="mx-auto flex h-16 max-w-2xl items-center gap-4 px-5 sm:px-8"><a class="mr-auto text-sm font-semibold tracking-[0.2em] text-leaf-700" href="/">PLANTORY</a><nav class="hidden items-center gap-4 sm:flex" aria-label="管理ナビゲーション"><a class="text-sm font-semibold text-stone-600" href="/">観察日記</a><a class="text-sm font-semibold text-stone-600" href="/plants">植物一覧</a><a class="text-sm font-semibold text-leaf-700 underline underline-offset-4" href="/settings/metrics" aria-current="page">送信間隔</a><a class="text-sm font-semibold text-stone-600" href="/settings/api-keys">APIキー管理</a></nav><button class="logout hidden text-sm font-semibold text-leaf-700 sm:block">ログアウト</button><details class="relative sm:hidden"><summary class="mobile-menu-toggle flex size-11 cursor-pointer list-none items-center justify-center rounded-xl bg-leaf-100 text-xl leading-none text-leaf-700" aria-label="メニューを開く"><span aria-hidden="true">☰</span></summary><nav class="absolute right-0 top-12 z-20 grid w-52 gap-1 rounded-2xl border border-leaf-100 bg-white p-2 shadow-xl" aria-label="管理メニュー"><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/">観察日記</a><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/plants">植物一覧</a><a class="rounded-xl bg-leaf-50 text-leaf-700 px-4 py-3 text-sm font-semibold" href="/settings/metrics" aria-current="page">送信間隔</a><a class="rounded-xl text-stone-600 hover:bg-leaf-50 px-4 py-3 text-sm font-semibold" href="/settings/api-keys">APIキー管理</a><button class="logout rounded-xl px-4 py-3 text-left text-sm font-semibold text-leaf-700 hover:bg-leaf-50">ログアウト</button></nav></details></div></header>
    <main class="mx-auto w-full max-w-2xl flex-1 px-5 pb-8 pt-24 sm:px-8 sm:pb-12 sm:pt-28">
      <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">送信間隔</h1>
      <p class="mt-3 leading-7 text-stone-600">全センサー共通の、計測データを送る間隔を設定します。</p>
      <section class="mt-10 rounded-2xl border border-leaf-100 bg-white p-6 shadow-sm" aria-labelledby="interval-heading">
        <h2 id="interval-heading" class="text-lg font-semibold">計測データの送信</h2>
        <p id="current-interval" class="mt-3 text-sm text-stone-600" role="status">設定を読み込んでいます…</p>
        <button id="retry-load" type="button" class="mt-3 hidden text-sm font-semibold text-leaf-700 underline underline-offset-4">再読み込み</button>
        <form id="metrics-settings-form" class="mt-6">
          <fieldset id="settings-fields" disabled>
            <label for="interval-hours" class="block text-sm font-semibold">送信間隔</label>
            <select id="interval-hours" name="interval_hours" aria-describedby="interval-help" class="mt-2 w-full rounded-xl border border-leaf-100 bg-white px-4 py-3 text-base outline-none transition focus:border-leaf-500 focus:ring-2 focus:ring-leaf-100 disabled:opacity-60">
              <option value="1">1時間おき</option>
              <option value="2">2時間おき</option>
              <option value="3" selected>3時間おき</option>
              <option value="4">4時間おき</option>
              <option value="6">6時間おき</option>
              <option value="8">8時間おき</option>
              <option value="12">12時間おき</option>
              <option value="24">24時間おき</option>
            </select>
            <p id="interval-help" class="mt-3 text-sm leading-6 text-stone-600">日本時間の0時を基準に送信します。たとえば6時間おきなら、0時・6時・12時・18時です。変更は、各センサーが次の正時に設定を取得すると反映されます。</p>
            <div class="mt-6 flex justify-end"><button id="save-settings" type="submit" class="rounded-xl bg-leaf-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-leaf-500 disabled:cursor-wait disabled:opacity-60">保存する</button></div>
          </fieldset>
        </form>
        <p id="settings-feedback" class="mt-4 text-sm" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="border-t border-leaf-100/80 py-3 text-center text-sm text-stone-500">© 2026 Plantory</footer>
    <script type="module" src="/authenticated-header.js"></script>
    <script type="module" src="/metrics-settings.js"></script>
  </body>
</html>

name: Firmware

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - "scripts/test-firmware-schedule.mjs"
      - "package.json"
      - ".github/workflows/firmware.yml"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "firmware/**"
      - "scripts/test-firmware-schedule.mjs"
      - "package.json"
      - ".github/workflows/firmware.yml"

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:firmware
